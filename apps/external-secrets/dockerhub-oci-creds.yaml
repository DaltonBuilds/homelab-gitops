---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub-oci-creds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: dockerhub-oci-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: helm
        name: dockerhub-oci
        enableOCI: "true"
        url: registry-1.docker.io
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: dockerhub-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: dockerhub-credentials
        property: password
