apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-gateway-tls
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretName: homelab-gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.daltonbuilds.com"
  dnsNames:
    - "*.daltonbuilds.com"
    - "daltonbuilds.com"
