---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: homelab
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api
    path: config/crd/standard
    # Pinned to v1.2.1 due to Cilium 1.19.1 bug (cilium/cilium#44920):
    # v1.5.x standard channel includes TLSRoute at v1, but Cilium hardcodes
    # v1alpha2 and crashes. Upgrade back to v1.5.x when Cilium patches this.
    targetRevision: v1.2.1
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false 
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true