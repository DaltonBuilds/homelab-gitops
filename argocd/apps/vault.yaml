---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: homelab
  source:
    repoURL: oci://registry-1.docker.io/bitnamicharts
    chart: vault
    targetRevision: 1.9.0
    helm:
      valuesObject:
        server:
          config: |
            ui = true
            listener "tcp" {
              address = "[::]:8200"
              tls_disable = 1
            }
            storage "raft" {
              path = "/bitnami/vault/data"
            }
            telemetry {
              prometheus_retention_time = "30s"
              disable_hostname = true
              unauthenticated_metrics_access = true
            }

          persistence:
            enabled: true
            storageClass: nfs-zfs-retain
            size: 5Gi

          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi

          metrics:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
