---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: homelab
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.29.1
    helm:
      valuesObject:
        server:
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                address = "[::]:8200"
                tls_disable = 1
              }
              storage "raft" {
                path = "/vault/data"
              }
              telemetry {
                prometheus_retention_time = "30s"
                disable_hostname = true
                unauthenticated_metrics_access = true
              }

          dataStorage:
            enabled: true
            storageClass: nfs-zfs-retain
            size: 5Gi

          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi

          service:
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "8200"
              prometheus.io/path: "/v1/sys/metrics?format=prometheus"

        ui:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
