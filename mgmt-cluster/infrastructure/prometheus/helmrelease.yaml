---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  valuesFrom:
    - kind: Secret
      name: grafana-admin-secret
      valuesKey: adminPassword
      targetPath: grafana.adminPassword
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheus:
      # Expose the Prometheus HTTP API (including remote-write receiver) at
      # 192.168.40.52:30090 so Alloy on the workload cluster can push metrics.
      # NodePort 30090 is in the k3s default range; the receiver is enabled via
      # enableRemoteWriteReceiver below.
      service:
        type: NodePort
        nodePort: 30090

      prometheusSpec:
        enableRemoteWriteReceiver: true
        retention: 15d
        resources:
          requests:
            memory: 2Gi
            cpu: 500m
          limits:
            memory: 4Gi
        
        # Scrape workload cluster node-exporters
        additionalScrapeConfigs:
          
          - job_name: 'workload-nodes'
            static_configs:
              - targets:
                  - '192.168.40.30:9100'  # gandalf
                  - '192.168.40.31:9100'  # aragorn
                  - '192.168.40.32:9100'  # legolas
                  - '192.168.40.33:9100'  # gimli
                  - '192.168.40.51:9100'  # nfs-server
          
          - job_name: 'garage'
            static_configs:
              - targets:
                  - '192.168.40.53:3903' # garage
    
    # Disable chart's node-exporter — mgmt-plane already runs
    # prometheus-node-exporter via apt (installed by Ansible common.yaml).
    # Both bind host port 9100, causing a conflict.
    nodeExporter:
      enabled: false
    prometheus-node-exporter:
      enabled: false

    grafana:
      initChownData:
        enabled: false
      persistence:
        enabled: true
        size: 5Gi

      # Prometheus is auto-provisioned by kube-prometheus-stack's sidecar.
      # Loki and Alertmanager are separate deployments and must be added here.
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
          isDefault: false
          jsonData:
            maxLines: 1000
            timeout: 60

        - name: Alertmanager
          type: alertmanager
          url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
          access: proxy
          jsonData:
            # Must be "prometheus" — this is Prometheus Alertmanager, not Grafana-managed alerts.
            implementation: prometheus

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 512Mi
