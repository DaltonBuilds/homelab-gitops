---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  valuesFrom:
    - kind: Secret
      name: garage-loki-secret
      valuesKey: access_key_id
      targetPath: loki.storage.s3.access_key_id
    - kind: Secret
      name: garage-loki-secret
      valuesKey: secret_access_key
      targetPath: loki.storage.s3.secret_access_key
  chart:
    spec:
      chart: loki
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    deploymentMode: SingleBinary

    # Loki chart v6.x defaults read/write/backend to non-zero replicas for
    # SimpleScalable mode. Chart validation rejects having both singleBinary
    # and SimpleScalable components with replicas > 0, so zero them out
    # explicitly when using SingleBinary mode.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1

      schemaConfig:
        configs:
          - from: "2025-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      limits_config:
        retention_period: 720h
      storage:
        type: s3
        bucketNames:
          chunks: loki-chunks
          ruler: loki-chunks
          admin: loki-chunks
        s3:
          endpoint: http://192.168.40.53:3900
          region: garage
          s3ForcePathStyle: true
    singleBinary:
      replicas: 1
      resources:
        requests:
          memory: 1Gi
          cpu: 250m
        limits:
          memory: 2Gi

    # Expose Loki's HTTP push/query API outside the mgmt cluster so Alloy
    # on the workload cluster can reach it at 192.168.40.52:30100.
    # The gateway is an nginx proxy that routes /loki/api/v1/push (and reads)
    # to the single-binary pod. NodePort 30100 is stable in the k3s default
    # range (30000–32767) and doesn't conflict with other services.
    gateway:
      enabled: true
      service:
        type: NodePort
        nodePort: 30100
